<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Weather Forecast">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1976d2"/>
      <stop offset="100%" stop-color="#0e529e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="0.6"/>
      <feOffset dx="0" dy="0.8" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>
  <g filter="url(#softShadow)">
    <g stroke="#ffca28" stroke-width="2.2" stroke-linecap="round">
      <line x1="25.6" y1="9.6"  x2="25.6" y2="14.4"/>
      <line x1="25.6" y1="36.8" x2="25.6" y2="41.6"/>
      <line x1="9.6"  y1="25.6" x2="14.4" y2="25.6"/>
      <line x1="36.8" y1="25.6" x2="41.6" y2="25.6"/>
      <line x1="14.4" y1="14.4" x2="17.8" y2="17.8"/>
      <line x1="33.4" y1="33.4" x2="36.8" y2="36.8"/>
      <line x1="36.8" y1="14.4" x2="33.4" y2="17.8"/>
      <line x1="17.8" y1="33.4" x2="14.4" y2="36.8"/>
    </g>
    <circle cx="25.6" cy="25.6" r="9.2" fill="#ffca28" stroke="#ffa726" stroke-width="0.6"/>
    <g fill="#ffffff">
      <circle cx="26" cy="42" r="8"/>
      <circle cx="37" cy="37" r="10"/>
      <circle cx="48" cy="40" r="8"/>
      <circle cx="52" cy="45" r="7"/>
      <rect x="20" y="44" width="36" height="9" rx="4.5" ry="4.5"/>
    </g>
  </g>
</svg>
